services:
  gitopiad:
    image: gitopia/gitopiad-e2e
    build:
      context: ../../
      dockerfile: Dockerfile
    volumes:
      - ./scripts/setup_chain.sh:/gitopia/setup.sh
      - ./data/gitopia/:/gitopia/.gitopia/
      # - gitopiad-binary:/gitopia/bin  # New volume to share the binary
    entrypoint:
      - /gitopia/setup.sh
    environment:
      - HOME=/gitopia
      - CHAIN_ID=localgitopia
    ports:
      - 1317:1317
      - 9090:9090
      - 26657:26657
    expose:
      - 9090
      - 26657
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gitopia-localnet

  faucet:
    image: gitopia/faucet
    ports:
      - 4500:4500
    volumes:
      - gitopiad-binary:/usr/local/gitopia/bin:ro  # Share the binary with the faucet
    environment:
      - PATH=/usr/local/gitopia/bin:$PATH
    depends_on:
      gitopiad:
        condition: service_healthy
    networks:
      - gitopia-localnet

  # IPFS node for storage providers
  ipfs:
    container_name: ipfs
    image: ipfs/kubo:v0.25.0
    ports:
      - "4001:4001" # ipfs swarm
      - "5001:5001" # ipfs api
      - "8080:8080" # ipfs gateway
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - gitopia-localnet

  # IPFS Cluster for distributed storage
  cluster:
    container_name: ipfs-cluster
    image: ipfs/ipfs-cluster:v1.1.0
    depends_on:
      - ipfs
    environment:
      - CLUSTER_PEERNAME=${CLUSTER_PEERNAME:-cluster0}
      - CLUSTER_SECRET=${CLUSTER_SECRET:-e11341a263ca30e7c1d57a34c7f9097d3c687532d09fcab07aa13286165806dc}
      - CLUSTER_IPFSHTTP_NODEMULTIADDRESS=/dns4/ipfs/tcp/5001
      - CLUSTER_CRDT_TRUSTEDPEERS=${CLUSTER_TRUSTED_PEERS:-*}
      - CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS=/ip4/0.0.0.0/tcp/9094
    ports:
      - "9094:9094" # Cluster API
      - "9096:9096" # Cluster swarm
    volumes:
      - cluster_data:/data/ipfs-cluster
    networks:
      - gitopia-localnet

  # Storage Provider
  gitopia-storage:
    container_name: gitopia-storage
    image: gitopia/gitopia-storage:latest
    depends_on:
      - cluster
      - gitopiad
    ports:
      - "5002:5000"
    environment:
      - GITOPIA_OPERATOR_MNEMONIC=${GITOPIA_OPERATOR_MNEMONIC:?err_mnemonic_not_set}
    volumes:
      - ./data/storage/repos:/var/repos
      - ./data/storage/attachments:/var/attachments
      - ./data/storage/lfs-objects:/var/lfs-objects
      - ./config/storage-provider.toml:/etc/gitopia-storage/config.toml
    networks:
      - gitopia-localnet
    entrypoint: supervisord -c /etc/supervisord.conf

  # Prometheus monitoring
  prometheus:
    container_name: prometheus
    image: prom/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - gitopia-localnet
    restart: unless-stopped

  # Grafana monitoring
  grafana:
    container_name: grafana
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - gitopia-localnet
    depends_on:
      - prometheus
    restart: unless-stopped

