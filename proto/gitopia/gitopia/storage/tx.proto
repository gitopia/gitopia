syntax = "proto3";
package gitopia.gitopia.storage;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gitopia/gitopia/storage/types.proto";
import "gitopia/gitopia/storage/params.proto";
import "google/protobuf/timestamp.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";

option go_package = "github.com/gitopia/gitopia/v6/x/storage/types";

// Msg defines the Msg service.
service Msg {
  // RegisterProvider registers a new storage provider
  rpc RegisterProvider(MsgRegisterProvider) returns (MsgRegisterProviderResponse);

  // UpdateProvider updates a storage provider
  rpc UpdateProvider(MsgUpdateProvider) returns (MsgUpdateProviderResponse);
  
  // UpdateRepositoryPackfile updates repository packfile CID and root hash
  rpc UpdateRepositoryPackfile(MsgUpdateRepositoryPackfile) returns (MsgUpdateRepositoryPackfileResponse);

  // UpdateReleaseAssets updates multiple release assets in a single transaction
  rpc UpdateReleaseAssets(MsgUpdateReleaseAssets) returns (MsgUpdateReleaseAssetsResponse);

  // SubmitChallengeResponse submits proof for storage challenge
  rpc SubmitChallengeResponse(MsgSubmitChallengeResponse) returns (MsgSubmitChallengeResponseResponse);

  // WithdrawProviderRewards withdraws accumulated rewards for a provider
  rpc WithdrawProviderRewards(MsgWithdrawProviderRewards) returns (MsgWithdrawProviderRewardsResponse);

  // UnregisterProvider initiates the process of leaving the storage network
  rpc UnregisterProvider(MsgUnregisterProvider) returns (MsgUnregisterProviderResponse);

  // CompleteUnstake completes the unstaking process after the cooldown period
  rpc CompleteUnstake(MsgCompleteUnstake) returns (MsgCompleteUnstakeResponse);

  // IncreaseStake increases the stake of a storage provider
  rpc IncreaseStake(MsgIncreaseStake) returns (MsgIncreaseStakeResponse);

  // DecreaseStake decreases the stake of a storage provider with cooldown
  rpc DecreaseStake(MsgDecreaseStake) returns (MsgDecreaseStakeResponse);

  // CompleteDecreaseStake completes the stake decrease after cooldown period
  rpc CompleteDecreaseStake(MsgCompleteDecreaseStake) returns (MsgCompleteDecreaseStakeResponse);

  // UnjailProvider unjails a jailed provider after jail time expires
  rpc UnjailProvider(MsgUnjailProvider) returns (MsgUnjailProviderResponse);

  // ProposeRepositoryPackfileUpdate proposes a packfile update for user approval
  rpc ProposeRepositoryPackfileUpdate(MsgProposeRepositoryPackfileUpdate) returns (MsgProposeRepositoryPackfileUpdateResponse);

  // ApproveRepositoryPackfileUpdate approves a proposed packfile update
  rpc ApproveRepositoryPackfileUpdate(MsgApproveRepositoryPackfileUpdate) returns (MsgApproveRepositoryPackfileUpdateResponse);

  // RejectRepositoryPackfileUpdate rejects a proposed packfile update
  rpc RejectRepositoryPackfileUpdate(MsgRejectRepositoryPackfileUpdate) returns (MsgRejectRepositoryPackfileUpdateResponse);

  // UpdateParams updates the parameters of the storage module
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // ClawbackProviderStake claws back stake from a provider via a governance proposal
  rpc ClawbackProviderStake(MsgClawbackProviderStake) returns (MsgClawbackProviderStakeResponse);

  // UpdateLFSObject updates an existing LFS object
  rpc UpdateLFSObject(MsgUpdateLFSObject) returns (MsgUpdateLFSObjectResponse);

  // ProposeReleaseAssetsUpdate proposes a release assets update for user approval
  rpc ProposeReleaseAssetsUpdate(MsgProposeReleaseAssetsUpdate) returns (MsgProposeReleaseAssetsUpdateResponse);

  // ApproveReleaseAssetsUpdate approves a proposed release assets update
  rpc ApproveReleaseAssetsUpdate(MsgApproveReleaseAssetsUpdate) returns (MsgApproveReleaseAssetsUpdateResponse);

  // RejectReleaseAssetsUpdate rejects a proposed release assets update
  rpc RejectReleaseAssetsUpdate(MsgRejectReleaseAssetsUpdate) returns (MsgRejectReleaseAssetsUpdateResponse);

  // ProposeLFSObjectUpdate proposes an LFS object update for user approval
  rpc ProposeLFSObjectUpdate(MsgProposeLFSObjectUpdate) returns (MsgProposeLFSObjectUpdateResponse);

  // ApproveLFSObjectUpdate approves a proposed LFS object update
  rpc ApproveLFSObjectUpdate(MsgApproveLFSObjectUpdate) returns (MsgApproveLFSObjectUpdateResponse);

  // RejectLFSObjectUpdate rejects a proposed LFS object update
  rpc RejectLFSObjectUpdate(MsgRejectLFSObjectUpdate) returns (MsgRejectLFSObjectUpdateResponse);

  // ProposeRepositoryDelete proposes a repository deletion
  rpc ProposeRepositoryDelete(MsgProposeRepositoryDelete) returns (MsgProposeRepositoryDeleteResponse);

  // ApproveRepositoryDelete approves a proposed repository deletion
  rpc ApproveRepositoryDelete(MsgApproveRepositoryDelete) returns (MsgApproveRepositoryDeleteResponse);
}

// MsgRegisterProvider defines a message for registering as a storage provider
message MsgRegisterProvider {
  string creator = 1;
  string api_url = 2;
  string moniker = 3;
  cosmos.base.v1beta1.Coin stake = 4 [(gogoproto.nullable) = false];
  string ipfs_cluster_peer_multiaddr = 5;
}

message MsgRegisterProviderResponse {}

// MsgUpdateProvider defines a message for updating a storage provider
message MsgUpdateProvider {
  string creator = 1;
  string api_url = 2;
  string moniker = 3;
  string ipfs_cluster_peer_multiaddr = 4;
}

message MsgUpdateProviderResponse {}

// MsgUpdateRepositoryPackfile defines a message for updating repository packfile
message MsgUpdateRepositoryPackfile {
  string creator = 1;
  uint64 repository_id = 2;
  string name = 3;
  string cid = 4;
  bytes root_hash = 5;
  uint64 size = 6;
  // old_cid is the CID of the repository when the provider processed the request
  // only proceed with the update if the current CID matches old_cid
  string old_cid = 7;
}

message MsgUpdateRepositoryPackfileResponse {}

// MsgUpdateReleaseAssets defines a message for updating multiple release assets
message MsgUpdateReleaseAssets {
  string creator = 1;
  uint64 repository_id = 2;
  string tag = 3;
  repeated ReleaseAssetUpdate assets = 4;
}

message MsgUpdateReleaseAssetsResponse {}

// MsgSubmitChallengeResponse defines a message for submitting challenge response
message MsgSubmitChallengeResponse {
  string creator = 1;
  uint64 challenge_id = 2;
  bytes data = 3;
  Proof proof = 4;
}

message MsgSubmitChallengeResponseResponse {}

// MsgWithdrawProviderRewards defines a message for withdrawing provider rewards
message MsgWithdrawProviderRewards {
  string creator = 1;
}

message MsgWithdrawProviderRewardsResponse {
  repeated cosmos.base.v1beta1.Coin amount = 1 [(gogoproto.nullable) = false];
}

// MsgUnregisterProvider defines a message for initiating the unregistration process
message MsgUnregisterProvider {
  string creator = 1;
}

message MsgUnregisterProviderResponse {
  google.protobuf.Timestamp unstake_completion_time = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
}

// MsgCompleteUnstake defines a message for completing the unstaking process
message MsgCompleteUnstake {
  string creator = 1;
}

message MsgCompleteUnstakeResponse {
  repeated cosmos.base.v1beta1.Coin amount = 1 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgIncreaseStake defines a message for increasing provider stake
message MsgIncreaseStake {
  string creator = 1;
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}

message MsgIncreaseStakeResponse {}

// MsgDecreaseStake defines a message for decreasing provider stake
message MsgDecreaseStake {
  string creator = 1;
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}

message MsgDecreaseStakeResponse {
  google.protobuf.Timestamp completion_time = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
}

// MsgCompleteDecreaseStake defines a message for completing the stake decrease process
message MsgCompleteDecreaseStake {
  string creator = 1;
}

message MsgCompleteDecreaseStakeResponse {
  cosmos.base.v1beta1.Coin amount = 1 [(gogoproto.nullable) = false];
}

// MsgUnjailProvider defines a message for unjailing a jailed provider
message MsgUnjailProvider {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
}

message MsgUnjailProviderResponse {}

// MsgUpdateParams defines a message for updating the parameters of the storage module
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "storage/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // params defines the x/storage parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message MsgUpdateParamsResponse {}

// MsgClawbackProviderStake defines a message for clawing back stake from a provider.
// This is a governance-gated transaction.
message MsgClawbackProviderStake {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "storage/MsgClawbackProviderStake";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // provider is the address of the provider whose stake will be clawbacked.
  string provider = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // amount is the amount of stake to clawback.
  cosmos.base.v1beta1.Coin amount = 3 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message MsgClawbackProviderStakeResponse {}

// MsgUpdateLFSObject defines a message for updating an LFS object
message MsgUpdateLFSObject {
  string creator = 1;
  uint64 id = 2;
  uint64 repository_id = 3;
  string oid = 4;
  uint64 size = 5;
  string cid = 6;
  bytes root_hash = 7;
}

message MsgUpdateLFSObjectResponse {}

// MsgProposeRepositoryPackfileUpdate defines a message for proposing a packfile update
message MsgProposeRepositoryPackfileUpdate {
  string creator = 1;
  string user = 2;
  uint64 repository_id = 3;
  string name = 4;
  string cid = 5;
  bytes root_hash = 6;
  uint64 size = 7;
  // old_cid is the CID of the repository when the provider processed the request
  string old_cid = 8;
  // merge_commit_sha is the commit SHA when this proposal is for a merge pull request
  string merge_commit_sha = 9;
  // delete indicates this proposal is to delete the packfile instead of update
  bool delete = 10;
}

message MsgProposeRepositoryPackfileUpdateResponse {
  uint64 proposal_id = 1;
}

// MsgApproveRepositoryPackfileUpdate defines a message for approving a proposed packfile update
message MsgApproveRepositoryPackfileUpdate {
  string creator = 1;
  uint64 proposal_id = 2;
}

message MsgApproveRepositoryPackfileUpdateResponse {}

// MsgRejectRepositoryPackfileUpdate defines a message for rejecting a proposed packfile update
message MsgRejectRepositoryPackfileUpdate {
  string creator = 1;
  uint64 proposal_id = 2;
  string reason = 3; // optional reason for rejection
}

message MsgRejectRepositoryPackfileUpdateResponse {}

// MsgProposeReleaseAssetsUpdate defines a message for proposing a release assets update
message MsgProposeReleaseAssetsUpdate {
  string creator = 1;
  string user = 2;
  uint64 repository_id = 3;
  string tag = 4;
  repeated ReleaseAssetUpdate assets = 5;
}

message MsgProposeReleaseAssetsUpdateResponse {
  uint64 proposal_id = 1;
}

// MsgApproveReleaseAssetsUpdate defines a message for approving a proposed release assets update
message MsgApproveReleaseAssetsUpdate {
  string creator = 1;
  uint64 proposal_id = 2;
}

message MsgApproveReleaseAssetsUpdateResponse {}

// MsgRejectReleaseAssetsUpdate defines a message for rejecting a proposed release assets update
message MsgRejectReleaseAssetsUpdate {
  string creator = 1;
  uint64 proposal_id = 2;
  string reason = 3; // optional reason for rejection
}

message MsgRejectReleaseAssetsUpdateResponse {}

// MsgProposeLFSObjectUpdate defines a message for proposing an LFS object update
message MsgProposeLFSObjectUpdate {
  string creator = 1;
  string user = 2;
  uint64 repository_id = 3;
  string oid = 4;
  uint64 size = 5;
  string cid = 6;
  bytes root_hash = 7;
  // delete indicates this proposal is to delete the LFS object instead of create
  bool delete = 8;
}

message MsgProposeLFSObjectUpdateResponse {
  uint64 proposal_id = 1;
}

// MsgApproveLFSObjectUpdate defines a message for approving a proposed LFS object update
message MsgApproveLFSObjectUpdate {
  string creator = 1;
  uint64 proposal_id = 2;
}

message MsgApproveLFSObjectUpdateResponse {}

// MsgRejectLFSObjectUpdate defines a message for rejecting a proposed LFS object update
message MsgRejectLFSObjectUpdate {
  string creator = 1;
  uint64 proposal_id = 2;
  string reason = 3; // optional reason for rejection
}

message MsgRejectLFSObjectUpdateResponse {}

// MsgProposeRepositoryDelete defines a message for proposing a repository deletion
message MsgProposeRepositoryDelete {
  string creator = 1;
  string user = 2;
  uint64 repository_id = 3;
}

message MsgProposeRepositoryDeleteResponse {
  uint64 proposal_id = 1;
}

// MsgApproveRepositoryDelete defines a message for approving a proposed repository deletion
message MsgApproveRepositoryDelete {
  string creator = 1;
  uint64 proposal_id = 2;
}

message MsgApproveRepositoryDeleteResponse {}
