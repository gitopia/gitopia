syntax = "proto3";
package gitopia.gitopia.storage;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/timestamp.proto";
import "amino/amino.proto";

option go_package = "github.com/gitopia/gitopia/v6/x/storage/types";

// Provider represents a storage provider in the network
message Provider {
  string creator = 1;
  uint64 id = 2;
  string api_url = 3;
  google.protobuf.Timestamp join_time = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  google.protobuf.Timestamp unstake_completion_time = 5 [
    (gogoproto.nullable) = true,
    (gogoproto.stdtime) = true
  ];
  string moniker = 6;
  // status defines the current bond status of the provider
  BondStatus status = 7;
  // ipfs_cluster_peer_multiaddr defines the multiaddr of the IPFS cluster peer
  string ipfs_cluster_peer_multiaddr = 8;
  // pending_decrease_amount defines the amount to be decreased after cooldown
  cosmos.base.v1beta1.Coin pending_decrease_amount = 9 [(gogoproto.nullable) = true];
  // decrease_completion_time defines when the stake decrease can be completed
  google.protobuf.Timestamp decrease_completion_time = 10 [
    (gogoproto.nullable) = true,
    (gogoproto.stdtime) = true
  ];
  
  // Liveness and jail tracking fields
  bool jailed = 11;
  google.protobuf.Timestamp jail_until = 12 [
    (gogoproto.nullable) = true,
    (gogoproto.stdtime) = true
  ];
  uint64 consecutive_proof_faults = 13;
}

// BondStatus is the status of a storage provider.
enum BondStatus {
  option (gogoproto.goproto_enum_prefix) = false;

  // UNSPECIFIED defines an invalid provider status.
  BOND_STATUS_UNSPECIFIED = 0 [(gogoproto.enumvalue_customname) = "Unspecified"];
  // UNBONDED defines a provider that is not bonded.
  BOND_STATUS_UNBONDED = 1 [(gogoproto.enumvalue_customname) = "Unbonded"];
  // UNBONDING defines a provider that is unbonding.
  BOND_STATUS_UNBONDING = 2 [(gogoproto.enumvalue_customname) = "Unbonding"];
  // BONDED defines a provider that is bonded.
  BOND_STATUS_BONDED = 3 [(gogoproto.enumvalue_customname) = "Bonded"];
}

// Packfile represents a Git packfile stored in IPFS
message Packfile {
  string creator = 1;
  uint64 id = 2;
  uint64 repository_id = 3;
  string name = 4;
  uint64 size = 5;
  string cid = 6;
  bytes root_hash = 7;
  google.protobuf.Timestamp created_at = 8 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
  google.protobuf.Timestamp updated_at = 9 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
  string old_cid = 10;
}

// Release asset
message ReleaseAsset {
  string creator = 1;
  uint64 id = 2;
  uint64 repository_id = 3;
  string tag = 4;
  string name = 5;
  uint64 size = 6;
  string cid = 7;
  bytes root_hash = 8;
  string sha256 = 9;
  google.protobuf.Timestamp created_at = 10 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
  google.protobuf.Timestamp updated_at = 11 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}

// Mapping between packfile id and repository id
message PackfileRepositoryMapping {
  uint64 packfile_id = 1;
  uint64 repository_id = 2;
}

// Mapping between release asset id and repository id, tag and name
message ReleaseAssetRepositoryMapping {
  uint64 release_asset_id = 1;
  uint64 repository_id = 2;
  string tag = 3;
  string name = 4;
}

// LFSObject represents a Large File Storage object
message LFSObject {
  string creator = 1;
  uint64 id = 2;
  uint64 repository_id = 3;
  string oid = 4; // LFS object ID (SHA256)
  uint64 size = 5;
  string cid = 6;
  bytes root_hash = 7;
  google.protobuf.Timestamp created_at = 8 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
  google.protobuf.Timestamp updated_at = 9 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}

// Mapping between LFS object id and repository id
message LFSObjectRepositoryMapping {
  uint64 lfs_object_id = 1;
  uint64 repository_id = 2;
  string oid = 3;
}

// ChallengeType represents the type of storage challenge
enum ChallengeType {
  CHALLENGE_TYPE_UNSPECIFIED = 0;
  CHALLENGE_TYPE_PACKFILE = 1;
  CHALLENGE_TYPE_RELEASE_ASSET = 2;
  CHALLENGE_TYPE_LFS_OBJECT = 3;
}

// Challenge represents a storage proof challenge
message Challenge {
  uint64 id = 1;
  string provider = 2;
  ChallengeType challenge_type = 3;
  uint64 content_id = 4; // ID of either packfile or release asset based on challenge_type
  bytes root_hash = 5; 
  uint64 chunk_index = 6;
  google.protobuf.Timestamp created_at = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  google.protobuf.Timestamp deadline = 8 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  ChallengeStatus status = 9;
}

// ChallengeStatus represents the status of a challenge
enum ChallengeStatus {
  CHALLENGE_STATUS_UNSPECIFIED = 0;
  CHALLENGE_STATUS_PENDING = 1;
  CHALLENGE_STATUS_COMPLETED = 2;
  CHALLENGE_STATUS_FAILED = 3;
  CHALLENGE_STATUS_TIMEOUT = 4;
}

// BlockInfo stores information about a block
message BlockInfo {
  uint32 height = 1;
  google.protobuf.Timestamp timestamp = 2
      [ (gogoproto.nullable) = false, (gogoproto.stdtime) = true ];
}

// ProviderStake represents the stake of a provider
message ProviderStake {
  string provider = 1;
  repeated cosmos.base.v1beta1.Coin stake = 2 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (gogoproto.nullable)     = false,
    (amino.dont_omitempty)   = true
  ];
}

// ProviderRewards represents rewards for a provider
message ProviderRewards {
  string provider = 1;
  repeated cosmos.base.v1beta1.DecCoin rewards = 2 [
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (gogoproto.nullable)     = false,
    (amino.dont_omitempty)   = true
  ];
}

// Merkle proof
message Proof {
	repeated bytes hashes = 1;
	uint64 index = 2;
}

// CidReferenceCount represents the number of times a CID is referenced
message CidReferenceCount {
	string cid = 1;
	uint64 count = 2;
}

// StorageStats represents storage statistics broken down by type
message StorageStats {
  uint64 total_packfile_size = 1;
  uint64 total_release_asset_size = 2;
  uint64 total_lfs_object_size = 3;
}

// LivenessWindow represents a sliding window for tracking provider liveness
message LivenessWindow {
  string provider = 1;
  uint64 window_start_block = 2;
  uint64 window_end_block = 3;
  repeated uint64 missed_blocks = 4; // Block heights where provider failed to submit proof
  uint64 total_expected_submissions = 5;
  uint64 actual_submissions = 6;
}

// ProviderLivenessInfo tracks comprehensive liveness information for a provider
message ProviderLivenessInfo {
  string provider = 1;
  uint64 current_window_start_challenge = 2; // Challenge ID marking start of current window
  uint64 missed_submissions_in_window = 3;
  uint64 total_submissions_in_window = 4;
  double current_liveness_ratio = 5; // Current ratio in the sliding window
  uint64 last_submission_challenge = 6; // Challenge ID of last submission
  repeated uint64 recent_missed_challenges = 7; // Last N missed challenge IDs for tracking
  google.protobuf.Timestamp last_liveness_check = 8 [
    (gogoproto.nullable) = true,
    (gogoproto.stdtime) = true
  ];
}

// ProviderLivenessStats contains liveness statistics for querying
message ProviderLivenessStats {
  string provider = 1;
  double current_liveness_ratio = 2;
  uint64 total_submissions = 3;
  uint64 missed_submissions = 4;
  uint64 consecutive_liveness_faults = 5;
  uint64 consecutive_proof_faults = 6;
  bool is_jailed = 7;
  google.protobuf.Timestamp jail_until = 8 [(gogoproto.nullable) = true, (gogoproto.stdtime) = true];
}

// ProposalStatus represents the status of a packfile update proposal
enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_PENDING = 1;
  PROPOSAL_STATUS_APPROVED = 2;
  PROPOSAL_STATUS_REJECTED = 3;
  PROPOSAL_STATUS_EXPIRED = 4;
}

// ProposedPackfileUpdate represents a proposed packfile update awaiting approval
message ProposedPackfileUpdate {
  uint64 id = 1;
  string provider = 2; // provider who proposed the update
  uint64 repository_id = 3;
  string user = 4; // user who initiated the update
  string name = 5;
  string cid = 6;
  bytes root_hash = 7;
  uint64 size = 8;
  string old_cid = 9;
  ProposalStatus status = 10;
  google.protobuf.Timestamp proposed_at = 11 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  google.protobuf.Timestamp expires_at = 12 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
}

// ReleaseAssetUpdate represents a single release asset update within a batch
message ReleaseAssetUpdate {
  string name = 1;
  string cid = 2;
  bytes root_hash = 3;
  uint64 size = 4;
  string sha256 = 5;
  // old_cid is the CID of the release asset when the provider processed the request
  string old_cid = 6;
}

// ProposedReleaseAssetsUpdate represents a proposed release asset update awaiting approval
message ProposedReleaseAssetsUpdate {
  uint64 id = 1;
  string provider = 2; // provider who proposed the update
  uint64 repository_id = 3;
  string user = 4; // user who initiated the update
  string tag = 5;
  repeated ReleaseAssetUpdate assets = 6;
  ProposalStatus status = 7;
  google.protobuf.Timestamp proposed_at = 8 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  google.protobuf.Timestamp expires_at = 9 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
}

// ProposedLFSObjectUpdate represents a proposed LFS object update awaiting approval
message ProposedLFSObjectUpdate {
  uint64 id = 1;
  string provider = 2; // provider who proposed the update
  uint64 repository_id = 3;
  string user = 4; // user who initiated the update
  string oid = 5;
  uint64 size = 6;
  string cid = 7;
  bytes root_hash = 8;
  ProposalStatus status = 9;
  google.protobuf.Timestamp proposed_at = 10 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  google.protobuf.Timestamp expires_at = 11 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
}
